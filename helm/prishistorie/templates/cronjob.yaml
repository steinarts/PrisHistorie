apiVersion: batch/v1
kind: CronJob
metadata:
  name: prishistorie-cron
  namespace: {{ .Release.Namespace }}

spec:
  schedule: {{ .Values.cron.schedule | quote }}
  timeZone: {{ .Values.cron.timeZone | quote }}

  successfulJobsHistoryLimit: {{ .Values.cron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cron.failedJobsHistoryLimit }}
  concurrencyPolicy: {{ .Values.cron.concurrencyPolicy }} 

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: {{ .Values.cron.restartPolicy }}

          containers:
            - name: prishistorie-cron
              image: "{{ .Values.cron.image.repository }}:{{ .Values.cron.image.tag }}"
              imagePullPolicy: {{ .Values.cron.image.pullPolicy }}

              envFrom:
                - secretRef:
                    name: {{ .Values.secrets.app }}

              env:
                - name: PG_DSN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.postgres }}
                      key: PG_DSN

                - name: EMAIL_ALERTS_ENABLED
                  value: {{ .Values.cron.emailAlertsEnabled | quote }}

              command:
                - /usr/local/bin/python3
                - /app/PrisHistorie.py
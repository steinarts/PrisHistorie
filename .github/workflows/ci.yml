name: CI

on:
  push:
    branches: [main, master, LeanVersion]
  pull_request:
    branches: [main, master, LeanVersion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Normalize requirements encoding for CI
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("requirements.txt")
          raw = source.read_bytes()

          text = None
          for encoding in ("utf-8-sig", "utf-16", "utf-16-le", "utf-16-be", "cp1252"):
            try:
              text = raw.decode(encoding)
              break
            except UnicodeDecodeError:
              pass

          if text is None:
            raise RuntimeError("Could not decode requirements.txt with supported encodings")

          Path("requirements.ci.txt").write_text(text, encoding="utf-8", newline="\n")
          print("Wrote requirements.ci.txt as UTF-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt

      - name: Compile check
        run: python -m compileall . 2>&1 | tee compile.log

      - name: Run tests
        run: |
          set +e
          pytest -q --junitxml=pytest-report.xml 2>&1 | tee pytest.log
          test_exit=${PIPESTATUS[0]}
          set -e

          # Exit code 5 means "no tests collected". Keep CI green until tests are added.
          if [ "$test_exit" -ne 0 ] && [ "$test_exit" -ne 5 ]; then
            exit "$test_exit"
          fi

      - name: Dump debug info on failure
        if: failure()
        run: |
          echo "Python version:" | tee debug.log
          python -V | tee -a debug.log
          echo "Installed packages:" | tee -a debug.log
          pip freeze | tee -a debug.log
          echo "Top-level files:" | tee -a debug.log
          ls -la | tee -a debug.log
          echo "Potential log files:" | tee -a debug.log
          find . -maxdepth 4 -type f \( -name "*.log" -o -name "pytest-report.xml" \) | tee -a debug.log

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python-version }}-artifacts
          path: |
            requirements.ci.txt
            compile.log
            pytest.log
            pytest-report.xml
            debug.log
            logs/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f requirements.ci.txt compile.log pytest.log pytest-report.xml debug.log

  docker-build:
    name: Docker build checks
    runs-on: ubuntu-latest
    needs: python-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build -f DockerfileFastAPI -t prishistorie-fastapi:ci . 2>&1 | tee docker-fastapi-build.log

      - name: Build PrisHistorie image
        run: docker build -f DockerfilePrisHistorie -t prishistorie-cron:ci . 2>&1 | tee docker-prishistorie-build.log

      - name: Dump docker debug info on failure
        if: failure()
        run: |
          docker ps -a > docker-ps.log || true
          docker images > docker-images.log || true
          docker info > docker-info.log || true

      - name: Upload Docker artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-artifacts
          path: |
            docker-fastapi-build.log
            docker-prishistorie-build.log
            docker-ps.log
            docker-images.log
            docker-info.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup docker resources
        if: always()
        run: |
          docker image rm prishistorie-fastapi:ci prishistorie-cron:ci || true
          docker system prune -af || true
          rm -f docker-fastapi-build.log docker-prishistorie-build.log docker-ps.log docker-images.log docker-info.log
